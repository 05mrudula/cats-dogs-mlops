services:
  cats-dogs-api:
    image: ghcr.io/05mrudula/cats-dogs-api:latest
    container_name: cats-dogs-api
    ports:
      - "8001:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
